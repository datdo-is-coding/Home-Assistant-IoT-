# ==============================================================================
# Mosquitto Production Configuration — DTV Smart Home IoT
# ==============================================================================

# Global authentication & authorization
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Standard internal listener (localhost / container network)
listener 1883

# Production TLS Listener (MQTTS)
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2
require_certificate false

# Persistence & logging
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Security & resource protection limits
max_queued_messages 1024
message_size_limit 65536
max_connections 256


