# ==============================================================================
# Mosquitto Access Control List (ACL) — DTV Smart Home IoT
# ==============================================================================

# 1. Gateway Administrator User (smarthome_gateway & gateway)
user smarthome_gateway
topic readwrite #
topic readwrite $SYS/#

user gateway
topic readwrite #
topic readwrite $SYS/#

# 2. Local Backend Service / Subscriber
user subscriber
topic readwrite esp32/sensor/data
topic read smarthome/#
topic read home/#

# 3. Per-device pattern rules (authenticated by device username = device_id / UID)
# Device %u can only receive its own commands and publish its own status & telemetry
pattern readwrite esp32/sensor/data
pattern read smarthome/cmd/%u/#
pattern read smarthome/command/%u/#
pattern read smarthome/cfg/%u/#
pattern write smarthome/status/%u/#
pattern write smarthome/tele/%u/#
pattern write smarthome/telemetry/%u/#

# Industrial Twin & Relay topics
pattern read home/devices/%u/config/desired
pattern write home/devices/%u/config/reported
pattern read home/devices/%u/relay/+/set
pattern write home/devices/%u/relay/+/state
pattern write home/devices/%u/telemetry
pattern write home/devices/%u/status
pattern read home/devices/%u/ota/trigger
pattern write home/devices/%u/ota/progress

# SubBox route topics
pattern readwrite home/subbox/%u/#
pattern readwrite home/nodes/%u/#

# ------------------------------------------------------------------------------
# Cross-SubBox KWS: publisher / destination / kind, outside home/subbox/%u/#.
# Only the destination can read. Writing requires an explicit pair grant below.
# Never grant a device write access to another publisher's prefix.
pattern read home/kws/+/%u/command
pattern read home/kws/+/%u/ack
# Add these lines to the matching user blocks, with real registered IDs:
# user SBSOURCE
# topic write home/kws/SBSOURCE/SBTARGET/command
# user SBTARGET
# topic write home/kws/SBTARGET/SBSOURCE/ack
# Revoke grants on ownership change. No wildcard write grants.
