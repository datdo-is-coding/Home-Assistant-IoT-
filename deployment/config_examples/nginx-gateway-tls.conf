# ==============================================================================
# AETHERIA SMART HOME GATEWAY — NGINX TLS REVERSE PROXY TEMPLATE
# ==============================================================================
# Installation on Debian / Raspberry Pi OS:
#   sudo apt install -y nginx
#   sudo cp deployment/config_examples/nginx-gateway-tls.conf /etc/nginx/sites-available/gateway-tls.conf
#   sudo ln -sf /etc/nginx/sites-available/gateway-tls.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Upstream Gateway Web Server (HTTP REST API & WebUI)
upstream gateway_web {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Upstream Gateway Audio Server (WebSocket PCM / Audio Streaming)
upstream gateway_audio_ws {
    server 127.0.0.1:8765;
    keepalive 32;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gateway.local home.local _;

    # Allow ACME HTTP-01 challenge if using Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS & WSS Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.local home.local _;

    # SSL Certificate Configuration
    # Replace with path to your valid TLS certificates
    ssl_certificate /etc/ssl/certs/gateway.crt;
    ssl_certificate_key /etc/ssl/private/gateway.key;

    # Secure TLS Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 64M;

    # WebSocket Audio Streaming Endpoint (/ws or /ws/audio)
    location /ws {
        proxy_pass http://gateway_audio_ws;
        proxy_http_version 1.1;

        # Upgrade headers for WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Gateway Web Server & REST API
    location / {
        proxy_pass http://gateway_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto https signals Gateway to enable Secure flag on Cookies
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
