publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.0
  file_picker: ^8.0.0
  ota_update: ^7.1.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.22

flutter:
  uses-material-design: true
