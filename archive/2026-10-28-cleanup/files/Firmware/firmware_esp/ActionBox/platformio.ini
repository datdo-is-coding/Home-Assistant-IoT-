; PlatformIO Project Configuration File for ESP32-S3 ActionBox
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for other options and examples:
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3_actionbox
src_dir = src

[env:esp32s3_actionbox]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; 16MB Flash Configuration matching IoT_Board Hardware
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

build_flags = 
    -D ACTIONBOX_FW=1
    -D CORE_DEBUG_LEVEL=3
    -I src
    -I src/config
    -I src/drivers/relay
    -I src/drivers/current_sensor
    -I src/drivers/button
    -I src/drivers/led
    -I src/protocol
    -I src/network
    -I src/device
    -I src/safety
    -I src/storage
    -I src/system
