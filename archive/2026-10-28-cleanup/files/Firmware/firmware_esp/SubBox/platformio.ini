; PlatformIO Project Configuration File for ESP32-S3 SubBox / SubGateway
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for other options and examples:
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3_subbox
src_dir = src

[env:esp32s3_subbox]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; 16MB Flash & PSRAM Configuration matching SubBox Hardware
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = opi_opi

build_flags = 
    -D SUBBOX_FW=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -I src
    -I src/config
    -I src/audio
    -I src/audio/audio_manager
    -I src/audio/audio_transport
    -I src/audio/audio_buffer
    -I src/audio/vad
    -I src/audio/asr
    -I src/audio/audio_output
    -I src/nlu
    -I src/nlu/normalizer
    -I src/nlu/intent
    -I src/nlu/entity
    -I src/nlu/context
    -I src/actionbox
    -I src/actionbox/registry
    -I src/actionbox/protocol
    -I src/actionbox/router
    -I src/room
    -I src/rules
    -I src/mqtt
    -I src/tts
    -I src/storage
    -I src/system
