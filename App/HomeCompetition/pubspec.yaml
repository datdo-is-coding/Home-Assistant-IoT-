name: home_competition
description: "HomeCompetition - Firebase smart home and energy dashboard"
publish_to: 'none'
version: 1.2.2+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_database: ^12.6.1
  google_sign_in: 6.2.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  file_picker: ^8.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

dev_dependencies:
  firebase_core_platform_interface: ^8.1.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.22

flutter:
  uses-material-design: true
